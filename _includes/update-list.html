<!-- Pinned posts panel — shadows the theme's update-list.html
     (Recently Updated) with a list of posts front-mattered pin: true -->

{% assign pinned = site.posts | where: 'pin', 'true' %}

{% if pinned.size > 0 %}
  <section id="access-lastmod">
    <h2 class="panel-heading">
      <i class="fas fa-thumbtack fa-fw me-1"></i>Pinned
    </h2>
    <ul class="content list-unstyled ps-0 pb-1 ms-1 mt-2">
      {% for post in pinned %}
        <li class="text-truncate lh-lg">
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </section>
  <!-- #access-lastmod -->
{% endif %}
